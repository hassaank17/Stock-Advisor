name: Stock Scanner Daily Analysis

on:
  schedule:
    # Monday to Friday at 13:47 UTC (8:47 AM EST / 9:47 AM EDT), so the report
    # lands around 14:00 UTC. Deliberately not on the hour: GitHub queues
    # scheduled runs, and the start of every hour is the busiest slot, where
    # runs are delayed the longest.
    - cron: '47 13 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build the report and print it in the run log, but send no email'
        type: boolean
        default: false
      models:
        description: 'Gemini models to try, in order (comma-separated). Leave blank for the default.'
        type: string
        required: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Market Analysis & Send Email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          # Optional repository variable (Settings > Secrets and variables >
          # Actions > Variables) to change models without editing code.
          GEMINI_MODELS: ${{ inputs.models || vars.GEMINI_MODELS }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: '1'
        run: python main.py

  keepalive:
    # GitHub switches off scheduled workflows in public repositories after 60
    # days without repository activity, which silently stops the daily report.
    # Re-enabling the workflow through the API on every run resets
    # that countdown. It runs as its own job so that only this one command gets
    # the extra `actions: write` permission.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/daily_scan.yml/enable"
